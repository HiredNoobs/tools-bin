general {
    # Quickshell's lockscreen, or hyprlock (made to look the same) if the shell isn't running
    lock_cmd = pidof hyprlock || qs ipc call lock lock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Lock after 10 minutes on battery.
# Retries each minute so being unplugged while idle still locks.
listener {
    timeout = 600
    condition_cmd = ! systemd-ac-power
    condition_retry = 60
    on-timeout = loginctl lock-session
}

# Lock after 1 hour on AC power
listener {
    timeout = 3600
    on-timeout = loginctl lock-session
}

# Screen off after 15 minutes on battery.
# Retries each minute so being unplugged while idle still turns it off.
listener {
    timeout = 900
    condition_cmd = ! systemd-ac-power
    condition_retry = 60
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Screen off after 1 hour 30 minutes on AC power
listener {
    timeout = 5400
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspend after 20 minutes on battery. systemd-ac-power reports AC on desktops
# (no battery) and whenever a charger is online, whatever the battery status says.
# Retries each minute so being unplugged while idle still suspends.
listener {
    timeout = 1200
    condition_cmd = ! systemd-ac-power
    condition_retry = 60
    on-timeout = systemctl suspend
}

# Suspend after 3 hours on AC power
listener {
    timeout = 10800
    on-timeout = systemctl suspend
}
