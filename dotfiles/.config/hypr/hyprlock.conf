# The fallback lockscreen, for when Quickshell isn't running (hypridle's lock_cmd), drawn to
# look like Quickshell's own (quickshell/lock/LockLayout.qml): the same sizes and positions,
# colours and font. Positions are from the screen's centre, up positive. hyprlock's font_size
# is in points, so 0.75 of the layout's pixel sizes. hyprlock can't size a shape to its text,
# so the bottom pills have fixed widths; it leaves out the track playing and the notification
# count, which need the shell. Battery, network and the power buttons come from lock-info.

# The colour scheme (Quickshell's ColourScheme writes it), with $accent and Theme.qml's alpha
# versions: $card, $surface, $subtext and $subtextMarkup
source = ~/.cache/wal/colors-hyprland.conf

$font = CodeNewRoman Nerd Font Propo
$critical = rgba(245, 60, 60, 1.0)
$warning = rgba(255, 190, 97, 1.0)
$info = ~/.config/hypr/scripts/lock-info

general {
    grace = 0
    hide_cursor = false
}

background {
    monitor =
    path = ~/.cache/current-wallpaper
    color = $background
    blur_passes = 2
    blur_size = 6
    brightness = 0.65
    contrast = 0.9
    vibrancy = 0.1
}

# --- Clock

label {
    monitor =
    text = $TIME
    color = $foreground
    font_size = 105
    font_family = $font Bold
    position = 0, 215
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $subtext
    font_size = 18
    font_family = $font
    position = 0, 118
    halign = center
    valign = center
}

# --- The card

shape {
    monitor =
    # hyprlock draws borders outside the size: 360 x 300 with it
    size = 356, 296
    color = $card
    rounding = 20
    border_size = 2
    border_color = $accent
    position = 0, -90
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.face
    size = 96
    rounding = -1
    border_size = 0
    position = 0, -16
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi, $USER
    color = $foreground
    font_size = 15
    font_family = $font
    position = 0, -90
    halign = center
    valign = center
}

input-field {
    monitor =
    # 304 x 44 with the outline
    size = 302, 42
    rounding = -1
    outline_thickness = 1
    inner_color = $surface
    outer_color = $accent
    check_color = $accent
    fail_color = $critical
    capslock_color = $warning
    font_color = $foreground
    font_family = $font
    placeholder_text = <span foreground="$subtextMarkup">Password</span>
    fail_text =
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    hide_input = false
    position = 0, -140
    halign = center
    valign = center
}

# The submit arrow, for looks (Enter submits)
label {
    monitor =
    text = 󰁔
    color = $foreground
    font_size = 11
    font_family = $font
    position = 130, -140
    halign = center
    valign = center
}

label {
    monitor =
    text = $FAIL
    color = $critical
    font_size = 10
    font_family = $font
    position = 0, -182
    halign = center
    valign = center
}

# --- Along the bottom: battery and network, then the power buttons

shape {
    monitor =
    size = 168, 44
    color = $card
    rounding = 22
    position = -77, 32
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:10000] $info status
    color = $foreground
    font_size = 10
    font_family = $font
    position = -77, 45
    halign = center
    valign = bottom
}

shape {
    monitor =
    size = 142, 44
    color = $card
    rounding = 22
    position = 90, 32
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:500] $info button Sleep
    color = $foreground
    font_size = 10
    font_family = $font
    position = 48, 45
    halign = center
    valign = bottom
    onclick = $info press Sleep
}

label {
    monitor =
    text = cmd[update:500] $info button Reboot
    color = $foreground
    font_size = 10
    font_family = $font
    position = 90, 45
    halign = center
    valign = bottom
    onclick = $info press Reboot
}

label {
    monitor =
    text = cmd[update:500] $info button Shutdown
    color = $foreground
    font_size = 10
    font_family = $font
    position = 132, 45
    halign = center
    valign = bottom
    onclick = $info press Shutdown
}
