# -----------------------------------------------------
# Theme
# -----------------------------------------------------
font_family CodeNewRoman Nerd Font Mono
font_size 11.0

include ~/.cache/wal/colors-kitty.conf

# -----------------------------------------------------
# General config
# -----------------------------------------------------
# Remove the "are you sure" confirmation on close
confirm_os_window_close 0

# Don't restore the last window's size and state: tiled windows get saved as maximised, which
# then makes floating ones (Exec.floating, float binds) open maximised instead of their size
remember_window_size no

# -----------------------------------------------------
# Shell
# -----------------------------------------------------
shell fish

# -----------------------------------------------------
# Keybinds
# -----------------------------------------------------
map ctrl+c    copy_or_interrupt
