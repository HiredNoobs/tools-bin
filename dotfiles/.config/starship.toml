# The prompt for bash and fish (both run `starship init`), so it's the same in each. Plain text
# and box drawing characters only, no Nerd Font needed. Two lines:
#
#   ╭─[production.core (monitoring)][master][!2][4s][✗ 1]
#   ╰─ (venv) tools-bin $

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# The group ( ... ) is left out when none of its modules has anything to show, so with nothing
# to add it's one line: the venv, the directory and $.
format = """
(╭─$kubernetes$git_branch$git_status$git_state$cmd_duration$status$jobs
╰─ )$python$directory${custom.prompt}"""

[kubernetes]
disabled = false
format = '\[[$context]($style)( \($namespace\))\]'
style = 'green'
contexts = [
  { context_pattern = '.*production.*', style = 'bold red' },
  { context_pattern = '.*test.*', style = 'yellow' },
]

[git_branch]
format = '\[$branch\]'

[git_status]
format = '(\[[$all_status$ahead_behind]($style)\])'
style = 'yellow'

[git_state]
format = '\[[$state( $progress_current/$progress_total)]($style)\]'

# Only an active venv, not every directory with Python files in it. On the second line, before
# the directory, as bash's (venv) was.
[python]
format = '\($virtualenv\) '
detect_extensions = []
detect_files = []
detect_folders = []

[cmd_duration]
min_time = 2_000
format = '\[[$duration]($style)\]'
style = 'yellow'

[status]
disabled = false
format = '\[[✗ $status]($style)\]'
style = 'red'

[jobs]
symbol = '&'
# The count even for one job (&1).
number_threshold = 1
format = '\[[$symbol$number]($style)\]'

# The last directory only, like bash's \W.
[directory]
truncation_length = 1
truncate_to_repo = false
read_only = ' (ro)'
format = '$path$read_only '

# $ or # (root), as bash's \$ does. The character module can't tell root apart.
[character]
disabled = true

[custom.prompt]
command = '[ "$(id -u)" -eq 0 ] && echo "#" || echo "$"'
when = true
shell = ['sh']
format = '$output '
